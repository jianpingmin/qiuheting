name: Generate Qiuheting Logo Assets
on:
  push:
    branches: [main]
    paths:
      - 'brand/logo/**'
      - '.github/workflows/logo-assets.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate PNG JPG and SVG variants
        run: python3 brand/logo/logo_generate.py
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brand/logo
          git diff --cached --quiet || git commit -m 'chore: regenerate logo assets [skip ci]'
          git push
